name: Validate Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - backend/**
  pull_request:
    paths:
      - backend/**

permissions:
  contents: read

concurrency:
  group: validate-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run unit tests
        run: npx --yes firebase-tools@14.16.0 emulators:exec --project demo-choreezo --only firestore "FIREBASE_PROJECT_ID=demo-choreezo go test ./..."

      - name: Run race tests
        run: npx --yes firebase-tools@14.16.0 emulators:exec --project demo-choreezo --only firestore "FIREBASE_PROJECT_ID=demo-choreezo go test -race ./..."

      - name: Run vet
        run: go vet ./...

      - name: Build API
        run: go build ./cmd/api
