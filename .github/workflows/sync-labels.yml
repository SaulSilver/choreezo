name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Sync repository labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const labelsPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'labels.json');
            const desiredLabels = JSON.parse(fs.readFileSync(labelsPath, 'utf8'));
            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const existingByName = new Map(existingLabels.map((label) => [label.name, label]));

            for (const label of desiredLabels) {
              const current = existingByName.get(label.name);

              if (!current) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Created label: ${label.name}`);
                continue;
              }

              if (
                current.color.toLowerCase() !== label.color.toLowerCase() ||
                (current.description || '') !== label.description
              ) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: current.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Updated label: ${label.name}`);
              }
            }
