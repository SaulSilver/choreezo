name: Validate Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - functions/**
  pull_request:
    paths:
      - functions/**

permissions:
  contents: read

concurrency:
  group: validate-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-package-lock

      - name: Build functions
        working-directory: functions
        run: npm run build
