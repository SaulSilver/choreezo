name: Validate App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - App.tsx
      - index.ts
      - app.json
      - eas.json
      - env.example
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
  pull_request:
    paths:
      - App.tsx
      - index.ts
      - app.json
      - eas.json
      - env.example
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**

concurrency:
  group: validate-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript validation
        run: npx tsc --noEmit
